name: Audit live here.now website (read-only)
on:
  workflow_dispatch:
    inputs:
      site_slug:
        description: "Existing verified owner-controlled here.now site slug"
        required: true
        default: "quiet-flint-6kde"
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout reviewed source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Offline audit tests
        run: python -m unittest discover -s tests -p 'test_audit_live_site.py' -v
      - name: Compare live HTTPS content to frozen SHA-256 source inventory
        env:
          SITE_SLUG: ${{ inputs.site_slug }}
        run: |
          python scripts/audit_live_site.py --slug "$SITE_SLUG"
          python scripts/check_retired_routes.py --slug "$SITE_SLUG"
