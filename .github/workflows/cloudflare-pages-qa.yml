name: Cloudflare Pages static staging QA (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'scripts/build_cloudflare_pages.py'
      - 'scripts/audit_cloudflare_pages.py'
      - 'tests/test_cloudflare_pages.py'
      - '.github/workflows/cloudflare-pages-qa.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - 'scripts/build_cloudflare_pages.py'
      - 'scripts/audit_cloudflare_pages.py'
      - 'tests/test_cloudflare_pages.py'
      - '.github/workflows/cloudflare-pages-qa.yml'
permissions:
  contents: read
jobs:
  static-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test static site, release gates and Cloudflare bundle
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild static output
        run: python scripts/build_cloudflare_pages.py
      - name: Check only frozen site files and Cloudflare headers shipped
        run: |
          test "$(find dist-cloudflare -type f | wc -l)" -eq 34
          test -f dist-cloudflare/_headers
          test ! -e dist-cloudflare/.github
          test ! -e dist-cloudflare/scripts
          test ! -e dist-cloudflare/token/index.html
