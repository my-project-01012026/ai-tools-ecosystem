name: Deploy static website to here.now (manual)
on:
  workflow_dispatch:
    inputs:
      site_slug:
        description: 'Existing here.now slug; leave empty when creating the site for the first time'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ai-tools-herenow-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Refuse deployment from an unprotected or non-main ref
        env:
          REF_NAME: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        shell: bash
        run: |
          test "$REF_NAME" = refs/heads/main && test "$REF_PROTECTED" = true
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run deployment security tests without production credentials
        run: python -m unittest discover -s tests -p 'test_publish_herenow.py' -v
      - name: Validate frozen website without network
        run: python scripts/publish_herenow.py
  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.ref_protected
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: here-now-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Publish only after protected environment approval
        env:
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          SITE_SLUG: ${{ inputs.site_slug }}
        shell: bash
        run: |
          if [ -z "$HERENOW_API_KEY" ]; then
            echo 'Missing HERENOW_API_KEY: deployment blocked.'
            exit 1
          fi
          if [ -n "$SITE_SLUG" ]; then
            python scripts/publish_herenow.py --publish --slug "$SITE_SLUG"
          else
            python scripts/publish_herenow.py --publish
          fi
