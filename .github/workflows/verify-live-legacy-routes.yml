name: Independent live legacy-route audit (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-live-legacy-routes.yml'
      - 'scripts/check_retired_routes.py'
      - 'tests/test_check_retired_routes.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-legacy-qa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-legacy-routes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed repository code with no credentials retained
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Offline tests (no network or secrets)
        run: python -m unittest discover -s tests -p 'test_check_retired_routes.py' -v
      - name: Check live retired token URLs separately from HSTS/CSP audit
        run: python scripts/check_retired_routes.py --slug quiet-flint-6kde
