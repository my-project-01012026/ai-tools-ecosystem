name: Cloudflare live acceptance (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-live-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Audit published Cloudflare site
        run: python scripts/audit_cloudflare_pages.py --host ai-tools-ecosystem.pages.dev
      - name: Independent public HTTP evidence
        if: always()
        shell: bash
        run: |
          for route in / /ru/ /cvlm/ /localaidevmanager/ /token/ /ru/token/ /404 /robots.txt; do
            echo "ROUTE: $route"
            curl --silent --show-error --max-time 15 --dump-header - --output /dev/null "https://ai-tools-ecosystem.pages.dev$route" | grep -Ei '^(HTTP/|strict-transport-security:|content-security-policy:|x-content-type-options:|x-robots-tag:|x-frame-options:|location:)'
          done
